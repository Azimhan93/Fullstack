<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>iPhone 17 — интернет-магазин</title>
        <meta name="description" content="Купить iPhone 17 по цене 40 000 грн. Характеристики, описание и доставка.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <main>
            <section>
                <h1>Регистрация</h1>

                <form>

                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="John"
                        required
                    >

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >

                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="18"
                        max="100"
                    >

                    <fieldset>
                        <legend>Gender</legend>

                        <input
                            type="radio"
                            id="male"
                            name="gender"
                            value="male"
                            required
                        >
                        <label for="male">Male</label>

                        <input
                            type="radio"
                            id="female"
                            name="gender"
                            value="female"
                        >
                        <label for="female">Female</label>
                    </fieldset>

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="12345"
                        required
                    >

                    <label for="city">City</label>

                    <select id="city" name="city" required>
                        <option value="" disabled selected>Choose a city</option>
                        <option value="kharkiv">Kharkiv</option>
                        <option value="kyiv">Kyiv</option>
                        <option value="odesa">Odesa</option>
                    </select>

                    <label for="about">About yourself</label>

                    <textarea
                        id="about"
                        name="about"
                        placeholder="Tell us about yourself"
                        maxlength="200"
                    ></textarea>

                    <label for="terms">I agree with the rules</label>
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <button type="submit">Create account</button>
                </form>
            </section>

        </main>

        <footer>
            <p>© 2026 My Store</p>
        </footer>
    </body>
</html>
