<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>iPhone 17 — интернет-магазин</title>
        <meta name="description" content="Купить iPhone 17 по цене 40 000 грн. Характеристики, описание и доставка.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <header>
            <a href="/">
                <img src="logo.png" alt="Company logo">
            </a>
            <nav>
                <ul>
                    <li><a href="/catalog">Каталог</a></li>
                    <li><a href="/delivery">Доставка</a></li>
                    <li><a href="/contacts">Контакты</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h1>iPhone 17</h1>
                <img src="iphone.jpg" alt="iPhone 17">
                <p>Цена: 40 000 грн</p>
                <button type="button">Купить</button>

                <h2>Описание товара</h2>
                <p>Новый смартфон Apple...</p>
            </section>

            <section>
                <h1>Регистрация</h1>

                <form>
                    <label for="name">Name</label>
                    <label for="email">Email</label>
                    <label for="password">Password</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="John"
                        required
                    >
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >
                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="18"
                        max="100"
                    >
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="12345"
                        required
                    >
                    <input
                        type="checkbox"
                        id="checkbox"
                        name="terms"
                        required
                    >
                    <label for="terms">Я согласен с правилами</label>

                    <button type="submit">Зарегистрироваться</button>
                </form>
            </section>

        </main>

        <footer>
            <p>© 2026 My Store</p>
        </footer>
    </body>
</html>
