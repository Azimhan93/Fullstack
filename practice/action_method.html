<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>iPhone 17 — Product Store</title>
        <meta name="description" content="Купить iPhone 17 по цене 40 000 грн. Характеристики, описание и доставка.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <main>
            <section>
                <h1>Product store</h1>

                <form action="/search" method="get">
                    <label for="query">Search an item</label>
                    <input
                        type="text"
                        id="query"
                        name="query"
                        required
                    >

                    <label for="category">Category</label>

                    <select id="category" name="category" required>
                        <option value="" disabled selected>Choose a category</option>
                        <option value="laptops">Laptops</option>
                        <option value="phones">Phones</option>
                        <option value="tablets">Tablets</option>
                    </select>
                    <button type="submit">Send</button>
                </form>
            </section>

            <section>
                <h1>Our blog</h1>

                <h2>Last articles</h2>

                <article>
                    <h3>How to learn JS</h3>
                    <p>Author: <span>Alex</span></p>
                    <p>Information about Javascript</p>
                    <a href="/home/javascript">read more</a>
                </article>

                <article>
                    <h3>React for beginners</h3>
                    <p>Author: <span>John</span></p>
                    <p>Information about React</p>
                    <a href="/home/react">read more</a>
                </article>

            </section>
            <section>
                <h1>Login</h1>

                <form action="/login" method="post">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="12345"
                        required
                    >

                    <button type="submit">Login</button>
                </form>

                <img src="user.png" alt="">

            </section>

            <section>
                <h1>Create an order</h1>

                <form action="/orders" method="post">

                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                    <label for="phone">Phone</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        required
                    >

                    <fieldset>
                        <legend>Delivery</legend>

                        <input
                            type="radio"
                            id="delivery"
                            name="receiveMethod"
                            value="delivery"
                            required
                        >
                        <label for="delivery">Delivery</label>

                        <input
                            type="radio"
                            id="pickup"
                            name="receiveMethod"
                            value="pickup"
                            required
                        >
                        <label for="pickup">Pickup</label>
                    </fieldset>

                    <label>
                        <input type="checkbox" name="callMe">
                        Call me
                    </label>

                    <label for="comment">Comment</label>

                    <textarea
                        id="comment"
                        name="comment"
                        rows="5"
                    ></textarea>

                    <button type="submit">Create an order</button>
                </form>
            </section>



        </main>

        <footer>
            <p>© 2026 My Store</p>
        </footer>
    </body>
</html>
